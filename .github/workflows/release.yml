name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-latest
            use_cross: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            use_cross: false
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            use_cross: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.94
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Install musl-tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="scaffold-${TAG}-${{ matrix.target }}.tar.gz"
          cp "target/${{ matrix.target }}/release/scaffold" scaffold
          tar czf "${ARCHIVE}" scaffold
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: scaffold-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true

  update-tap:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256 checksums
        id: sha
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          sha_aarch64_darwin=$(sha256sum "artifacts/scaffold-${TAG}-aarch64-apple-darwin.tar.gz" | awk '{print $1}')
          sha_x86_64_darwin=$(sha256sum "artifacts/scaffold-${TAG}-x86_64-apple-darwin.tar.gz" | awk '{print $1}')
          sha_aarch64_linux=$(sha256sum "artifacts/scaffold-${TAG}-aarch64-unknown-linux-musl.tar.gz" | awk '{print $1}')
          sha_x86_64_linux=$(sha256sum "artifacts/scaffold-${TAG}-x86_64-unknown-linux-musl.tar.gz" | awk '{print $1}')
          echo "aarch64_darwin=${sha_aarch64_darwin}" >> "$GITHUB_OUTPUT"
          echo "x86_64_darwin=${sha_x86_64_darwin}" >> "$GITHUB_OUTPUT"
          echo "aarch64_linux=${sha_aarch64_linux}" >> "$GITHUB_OUTPUT"
          echo "x86_64_linux=${sha_x86_64_linux}" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-scaffold tap
        uses: actions/checkout@v4
        with:
          repository: westonkd/homebrew-scaffold
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-scaffold

      - name: Update formula
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          SHA_AARCH64_DARWIN: ${{ steps.sha.outputs.aarch64_darwin }}
          SHA_X86_64_DARWIN: ${{ steps.sha.outputs.x86_64_darwin }}
          SHA_AARCH64_LINUX: ${{ steps.sha.outputs.aarch64_linux }}
          SHA_X86_64_LINUX: ${{ steps.sha.outputs.x86_64_linux }}
        run: |
          VERSION="${TAG#v}"
          cat > homebrew-scaffold/Formula/scaffold.rb <<FORMULA
          class Scaffold < Formula
            desc "Compose multi-repo development environments and manage AI agent artifacts"
            homepage "https://github.com/westonkd/scaffold"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/westonkd/scaffold/releases/download/${TAG}/scaffold-${TAG}-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_AARCH64_DARWIN}"
              else
                url "https://github.com/westonkd/scaffold/releases/download/${TAG}/scaffold-${TAG}-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_X86_64_DARWIN}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/westonkd/scaffold/releases/download/${TAG}/scaffold-${TAG}-aarch64-unknown-linux-musl.tar.gz"
                sha256 "${SHA_AARCH64_LINUX}"
              else
                url "https://github.com/westonkd/scaffold/releases/download/${TAG}/scaffold-${TAG}-x86_64-unknown-linux-musl.tar.gz"
                sha256 "${SHA_X86_64_LINUX}"
              end
            end

            def install
              bin.install "scaffold"
            end

            test do
              assert_match "scaffold", shell_output("#{bin}/scaffold --help")
            end
          end
          FORMULA

      - name: Commit and push formula update
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd homebrew-scaffold
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/scaffold.rb
          git commit -m "Update scaffold formula to ${TAG}"
          git push
