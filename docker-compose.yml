volumes:
  cargo-registry:
  cargo-git:

services:
  dev:
    build:
      context: .
      target: dev
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    environment:
      CARGO_TERM_COLOR: always
      CARGO_HOME: /usr/local/cargo
    stdin_open: true
    tty: true
    command: bash

  watch:
    build:
      context: .
      target: dev
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    environment:
      CARGO_TERM_COLOR: always
      CARGO_HOME: /usr/local/cargo
    command: cargo watch -w src -x run

  release:
    build:
      context: .
      target: release-builder
    volumes:
      - ./dist:/output
    restart: "no"
    command: sh -c "cp /workspace/target/x86_64-unknown-linux-musl/release/hoist /output/hoist"
